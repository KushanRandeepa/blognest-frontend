<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search & Discover - BlogNest</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/search.js"></script>
  <style>
    /* ===== Reset ===== */
   
    header h2 {
      font-size: 1.5rem;
      font-weight: bold;
      color: #3a2f2a;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 25px;
    }

    nav ul li a {
      text-decoration: none;
      color: #3a2f2a;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    nav ul li a:hover {
      color: #8b5e34;
    }

    /* ===== Search Section ===== */

    .search-section h1 {
      font-size: 3rem;
      margin-bottom: 15px;
      color: #e2d3d3;
    }

    .search-section p {
      font-size: 1.2rem;
      color: #dbcbc2;
      margin-bottom: 10px;
    }

    .search-box {
      width: 50%;
      margin-top: 2%;
      background: rgba(32, 48, 73, 0.8);
      padding: 14px 25px;
      border-radius: 10px;
      border: 1px solid var(--color-accent-cyan);
      box-shadow: 0 0 15px var(--color-accent-glow);
      position: relative;
      z-index: 2;
    }

    .search-box input {
      font-size: 1rem;
      padding: 10px;
    }
    .search-box input::placeholder {
      color: rgba(224, 251, 252, 0.5);
      /* Faded light text */
    }

    .search-btn {
  background: linear-gradient(90deg, #00c6ff, #ff4d79);
  color: #fff;
  padding: 10px 20px;
  border-radius: 8px;
  text-decoration: none;
  transition: 0.3s;
}

.searxh-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px #00c6ff, 0 0 20px #ff4d79;
}


    /* ===== Filters Section ===== */
    .filters-section {
      padding: 25px 50px;
  background: linear-gradient(135deg, #6599d9, #203A43, #101010);
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
    }

    .filters {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      font-size: 1rem;
      color: #ffffff;
    }

    .filters select {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 0.95rem;
      background: white;
      transition: all 0.3s ease;
    }

    .filters select:hover {
      border-color: #8b5e34;
    }

    /* ===== Results Section ===== */
    .results-section {
      padding: 50px;
    }

    .results-section h2 {
      font-size: 1.8rem;
      color: #ffffff;
      margin-bottom: 20px;
    }

    /* ===== Footer ===== */
    footer {
      text-align: center;
      background: rgba(10, 25, 47, 0.95);
      border-top: 1px solid var(--color-accent-cyan);
      padding: 20px;
      margin-top: 40px;
      font-size: 0.9rem;
      color: var(--color-text-light);
    }
  </style>
</head>

<body>
  <header>
    <!-- Logo + Site Name -->
    <div class="logo-container">
      <img src="./images/Untitled design (1).png" alt="BlogNest Logo" class="logo-img">
      <span class="logo">BlogNest</span>
    </div>

    <!-- Navigation -->
    <ul class="nav-links">
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="education.html">Education</a></li>
      <li><a href="entertainment.html">Entertainment</a></li>
      <li><a href="sport.html">Sports</a></li>
      <li><a href="aitech.html">AI & Tech</a></li>
      <li id="authLink"><a href="login.html" class="login-btn" id="authText">Login</a></li>
    </ul>
  </header>

  <!-- ===== Search & Discover Section ===== -->
  <section class="search-section">
    <h1>SEARCH & DISCOVER</h1>
    <p>Find exactly what you're looking for across our collection of articles</p>

    <!-- Search Bar -->
    <div>
      <input  type="text" placeholder="Search articles, topics, authors..." class="search-box" id="searchInput">
      <button class="search-btn" onclick="handleSearch()">search</button>
    </div>
    
    
    </button>
  </section>

  <!-- ===== Filters Section ===== -->
  <section class="results-section">
    <div class="filters">
      <span>🔍 Filters:</span>

      <label>Category:</label>
      <select id="categorySelect">
        <option  value="">All Categories</option>
        <option  value="aitech">AI & Tech</option>
        <option  value="education" >Education</option>
        <option  value="entertainment">Entertainment</option>
        <option  value="sport">Sports</option>
      </select>
 
      <label>Sort by:</label>
      <select id="sortSelect">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
        <option value="popular">Most Popular</option>
      </select>
    </div>
  </section>

  <!-- ===== Search Results Placeholder ===== -->
  <section class="results-section">
    <h2>SEARCH RESULTS</h2>
    <div id="article-grid" >
      <!-- Articles will be dynamically inserted here by entertainment.js -->
    </div>

  <!-- ===== Footer ===== -->
  <footer>
    <p>&copy; 2025 BlogNest | All rights reserved.</p>
  </footer>

</body>

</html>
