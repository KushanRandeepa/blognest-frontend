<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users | BlogNest Admin</title>
  <link rel="stylesheet" href="css/admin-style.css">
  <script src="js/admin.js"></script>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h2 onclick="navigateToEditorUI()" style="cursor:pointer;">Admin Panel</h2>
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="article-manage.html">Manage Articles</a>
    <a href="user-manage.html" class="active">Manage Users</a>
<a href="pending.html" class="sidebar-link">
  To Review <span id="pendingCount" class="pending-badge">0</span>
</a>      <a href="#">Analytics</a>
    <a href="#">Settings</a>
   <a href="#" onclick="logout()">Logout</a>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="header">
      <h1>Manage Users</h1>
       <button type="button" onclick="window.location.href='add-user.html'">+ New User</button>
    </div>

    <section class="table-section">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Created Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <!-- Users will be dynamically inserted here by admin.js -->
        </tbody>
      </table>
    </section>

    <!-- ================= Edit User Modal ================= -->
<div id="editUserModal" class="modal">
  <div class="modal-content">
    <h3>Edit User</h3>
    <form id="editUserForm">
      <!-- ID -->
      <label>User ID</label>
      <input type="text" id="editUserId" readonly />

      <!-- Username -->
      <label>Username</label>
      <input type="text" id="editUsername" required />

      <!-- Email -->
      <label>Email</label>
      <input type="email" id="editEmail" required />

      <!-- Role -->
      <label>Role</label>
      <select id="editRole" required>
        <option value="USER">User</option>
        <option value="ADMIN">Admin</option>
        
      </select>

      <div class="date-row">
        <div class="date-field">
          <label>Created At</label>
          <input type="text" id="editCreatedAt" readonly />
        </div>
      </div>

      <label>New Password (optional)</label>
      <input type="password" id="editPassword" placeholder="Enter new password" />

      <!-- Buttons -->
      <div class="modal-buttons">
        <button type="submit" id="saveUserChangesBtn">Save Changes</button>
        <button type="button" onclick="closeUserModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

    


    <footer>
      © 2025 BlogNest Admin Panel | All Rights Reserved
    </footer>
  </div>
</body>
</html>
