<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Ensures proper rendering and touch zooming on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Article | BlogNest</title>
    <script src="js/addArticle.js" defer></script>

    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configure Tailwind with the futuristic theme from your style.css -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              // Font from your style.css
              sans: ['Segoe UI', 'Tahoma', 'Geneva', 'Verdana', 'sans-serif'],
            },
            colors: {
              // Color palette from your style.css
              'deep-blue': '#0A192F',
              'dark-bg': '#121212',
              'text-light': '#E0FBFC',
              'accent-cyan': '#00FFFF',
              'accent-purple': '#9D4EDD',
              'accent-glow': 'rgba(0, 255, 255, 0.5)',
              'card-bg': '#172134', // A dark color for cards
            }
          }
        }
      }
    </script>

</head>
<body class="bg-deep-blue font-sans antialiased text-text-light">

    <!-- Main container with vertical and horizontal centering -->
    <div class="min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8">

        <!-- Form Card -->
        <div class="bg-card-bg p-6 sm:p-10 rounded-xl shadow-2xl shadow-accent-cyan/20 w-full max-w-2xl border border-accent-cyan/30">

            <!-- Header -->
            <header class="text-center">
                <h1 class="text-4xl font-bold text-accent-cyan">
                 <a href="index.html">   BlogNest</a>
                </h1>
                <p class="text-lg text-text-light/80 mt-2">Submit Your Article</p>
            </header>

            <!-- Submission Form -->
            <form id="articleForm" class="mt-8 space-y-6">

                <!-- Article Title -->
                <div>
                    <label for="article-title" class="block text-sm font-medium text-text-light">Article Title</label>
                    <input 
                        type="text" 
                        id="article-title" 
                        name="article-title" 
                        required 
                        placeholder="My Thoughts on Quantum Physics"
                        class="mt-1 block w-full rounded-lg bg-deep-blue border border-accent-cyan/30 shadow-sm p-3 text-text-light placeholder:text-text-light/40 focus:border-accent-cyan focus:ring focus:ring-accent-cyan focus:ring-opacity-50"
                    >
                </div>

                <!-- Article Type (Category) -->
                <div>
                    <label for="article-category" class="block text-sm font-medium text-text-light">Article Type / Category</label>
                    <select 
                        id="article-category" 
                        name="article-category" 
                        required 
                        class="mt-1 block w-full rounded-lg bg-deep-blue border border-accent-cyan/30 shadow-sm p-3 text-text-light focus:border-accent-cyan focus:ring focus:ring-accent-cyan focus:ring-opacity-50"
                    >
                        <option value="education">Education</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="ai-tech">AI & Tech</option>
                        <option value="sport">Sport</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <!-- Article Content (Text Area) -->
                <div>
                    <label for="article-content" class="block text-sm font-medium text-text-light">Article Content</label>
                    <textarea 
                        id="article-content" 
                        name="article-content" 
                        rows="10" 
                        required 
                        placeholder="Write your amazing article here..."
                        class="mt-1 block w-full rounded-lg bg-deep-blue border border-accent-cyan/30 shadow-sm p-3 text-text-light placeholder:text-text-light/40 focus:border-accent-cyan focus:ring focus:ring-accent-cyan focus:ring-opacity-50"
                    ></textarea>
                    <p class="mt-1 text-xs text-text-light/50">You can use Markdown for formatting.</p>
                </div>

                <!-- File Upload (Related Photos) -->
                <div>
                    <label for="article-photo" class="block text-sm font-medium text-text-light">Cover Photo</label>
                    <input 
                        type="file" 
                        id="article-photo" 
                        name="article-photo" 
                        accept="image/png, image/jpeg, image/gif"
                        class="mt-1 block w-full text-sm text-text-light/70 cursor-pointer
                               file:mr-4 file:py-2 file:px-4
                               file:rounded-lg file:border file:border-accent-cyan/50
                               file:text-sm file:font-semibold
                               file:bg-deep-blue file:text-accent-cyan
                               hover:file:bg-accent-cyan hover:file:text-deep-blue hover:file:cursor-pointer transition-colors duration-200"
                    >
                    <p class="mt-1 text-xs text-text-light/50">Optional: A high-quality photo for your article.</p>
                </div>
                
                <!-- Author Information (Grouped) -->
                <fieldset class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Student Name -->
                    <div>
                        <label for="student-name" class="block text-sm font-medium text-text-light">Your Name</label>
                        <input 
                            type="text" 
                            id="student-name" 
                            name="student-name" 
                            required 
                            placeholder="Alex Johnson"
                            class="mt-1 block w-full rounded-lg bg-deep-blue border border-accent-cyan/30 shadow-sm p-3 text-text-light placeholder:text-text-light/40 focus:border-accent-cyan focus:ring focus:ring-accent-cyan focus:ring-opacity-50"
                        >
                    </div>

                    <!-- Email Address -->
                    <div>
                        <label for="student-email" class="block text-sm font-medium text-text-light">Your Email Address</label>
                        <input 
                            type="email" 
                            id="student-email" 
                            name="student-email" 
                            required 
                            placeholder="alex.j@university.edu"
                            class="mt-1 block w-full rounded-lg bg-deep-blue border border-accent-cyan/30 shadow-sm p-3 text-text-light placeholder:text-text-light/40 focus:border-accent-cyan focus:ring focus:ring-accent-cyan focus:ring-opacity-50"
                        >
                    </div>
                </fieldset>

                <!-- Submission Button -->
                <div>
                    <button 
                        type="submit"
                        id="btn-submit"
                        class="w-full flex justify-center py-3 px-4 border border-transparent
                               rounded-lg shadow-sm text-base font-bold text-deep-blue 
                               bg-gradient-to-r from-accent-purple to-accent-cyan
                               hover:scale-105 hover:shadow-lg hover:shadow-accent-cyan/50
                               focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent-cyan
                               transition-all duration-300 ease-in-out"
                    >
                        Submit Article
                    </button>
                </div>

                <!-- Success Message Box (Hidden by default) -->
                <div 
                    id="messageBox" 
                    class="hidden p-4 rounded-lg text-sm"
                >
                    <!-- Content is set by JavaScript -->
                </div>

            </form>
        </div>
    </div>

</body>
</html>
