<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlogNest Admin Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/admin.js"></script>
  <link rel="stylesheet" href="css/admin-style.css" />
</head>



<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h2 onclick="navigateToEditorUI()" style="cursor:pointer;">Admin Panel</h2>
    <a href="admin-dashboard.html" class="active">Dashboard</a>
     <a href="article-manage.html" >Manage Articles</a>
    <a href="user-manage.html">Manage Users</a>
<a href="pending.html" class="sidebar-link">
  To Review <span id="pendingCount" class="pending-badge">0</span>
</a>  
  <a href="#">Analytics</a>
    <a href="#">Settings</a>
   <a href="#" onclick="logout()">Logout</a>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="header">
      <h1>Dashboard Overview</h1>
      <button type="button" onclick="window.location.href='addArticle.html'">+ New Post</button>
    </div>

    <!-- Summary Cards -->
    <div class="cards">
      <div class="card">
        <h3 id="totalPosts">Total Posts</h3>
        <p></p>
      </div>
      <div class="card">
        <h3 id="totalUsers">Users</h3>
        <p></p>
      </div>
      <div class="card">
        <h3 id="totalComments">Comments</h3>
        <p></p>
      </div>
      <div class="card">
        <h3 id="totalViews">Views</h3>
        <p></p>
      </div>
    </div>

    <!-- Charts -->
    <div class="charts">
      <div class="chart-box">
        <h3>Monthly Post Growth</h3>
        <canvas id="postChart"></canvas>
      </div>

      <div class="chart-box">
        <h3>User Signups (Weekly)</h3>
        <canvas id="userChart"></canvas>
      </div>
    </div>

    <footer>
      © 2025 BlogNest Admin Panel | All Rights Reserved
    </footer>
  </div>

  <script>
    // Posts growth chart
    const postCtx = document.getElementById('postChart').getContext('2d');
    new Chart(postCtx, {
      type: 'line',
      data: {
        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul','Aug','Sep','Oct','Nov','Dec'],
        datasets: [{
          label: 'Posts',
          data: [],
          borderColor: '#00ffff',
          backgroundColor: 'rgba(0,255,255,0.2)',
          tension: 0.4,
          fill: true
        }]
      },
      options: {
        plugins: { legend: { labels: { color: '#fff' } } },
        scales: {
          x: { ticks: { color: '#fff' } },
          y: { ticks: { color: '#fff' } }
        }
      }
    });

    // User signups chart
    const userCtx = document.getElementById('userChart').getContext('2d');
    new Chart(userCtx, {
      type: 'bar',
      data: {
        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
        datasets: [{
          label: 'Signups',
          data: [],
          backgroundColor: 'rgba(0,255,255,0.5)',
          borderColor: '#00ffff',
          borderWidth: 1
        }]
      },
      options: {
        plugins: { legend: { labels: { color: '#fff' } } },
        scales: {
          x: { ticks: { color: '#fff' } },
          y: { ticks: { color: '#fff' } }
        }
      }
    });
  </script>

  
</body>

</html>
