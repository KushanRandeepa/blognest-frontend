<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search & Discover - BlogNest</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* These are supplementary styles to theme elements 
      that are unique to search.html and not in the main style.css
    */

    /* ===== Search Section ===== */
    /* Override main CSS for .search-section to use flex for centering */
    .search-section {
      /* This uses flex to center its children */
      display: flex;
      justify-content: center; /* Vertically centers the content */
      align-items: center; /* Horizontally centers the content */
      
      /* min-height: 100vh; is already in style.css */
      
      /* Override the padding from style.css to allow perfect centering */
      padding: 20px;
    }

    /* This new wrapper holds the centered content */
    .search-content-wrapper {
      text-align: center; /* Centers the h1 and p text */
      width: 100%;
      max-width: 600px; /* Ensures wrapper doesn't get too wide */
      position: relative; /* Ensures it's above the ::before/::after circles */
      z-index: 2;
    }

    /* Add space (line space) between the paragraph and the search box */
    .search-content-wrapper p {
      margin-bottom: 25px;
    }

    .search-box {
      max-width: 600px;
      margin: auto; /* Keeps it centered within the wrapper */
      /* Use a dark, semi-transparent background matching the header */
      background: rgba(10, 25, 47, 0.8);
      padding: 15px 25px;
      border-radius: 10px;
      /* Add the cyan border and glow */
      border: 1px solid var(--color-accent-cyan);
      box-shadow: 0 0 15px var(--color-accent-glow);
      position: relative;
      z-index: 2;
    }

    

    /* Style the placeholder text */
    .search-box input::placeholder {
      color: rgba(224, 251, 252, 0.5);
      /* Faded light text */
    }

    /* ===== Results Section ===== */
    .results-section {
      /* This section will sit on the default 'deep-blue' body background */
      padding: 50px;
      min-height: 30vh;
      text-align: center;
    }

    .results-section h2 {
      font-size: 1.8rem;
      /* Use the accent cyan color */
      color: var(--color-accent-cyan);
      text-shadow: 0 0 8px var(--color-accent-glow);
      margin-bottom: 20px;
    }

    .results-section p {
      font-size: 1.1rem;
      color: var(--color-text-light);
    }

    /* ===== Footer ===== */
    footer {
      text-align: center;
      /* Match the header style for consistency */
      background: rgba(10, 25, 47, 0.95);
      border-top: 1px solid var(--color-accent-cyan);
      padding: 20px;
      margin-top: 50px;
      font-size: 0.9rem;
      color: var(--color-text-light);
    }
  </style>
</head>

<body>
  <header>
    <div class="logo-container">
      <img src="./images/Untitled design (1).png" alt="BlogNest Logo" class="logo-img">
      <span class="logo">BlogNest</span>
    </div>

    <ul class="nav-links">
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="education.html">Education</a></li>
      <li><a href="entertainment.html">Entertainment</a></li>
      <li><a href="sports.html">Sports</a></li>
      <li><a href="aitech.html">AI & Tech</a></li>
      <li><a href="search.html" class="search-link">🔍</a></li>
    </ul>
  </header>

  <section class="search-section">
    <div class="search-content-wrapper">
      <h1>SEARCH & DISCOVER</h1>
      <p>Find exactly what you're looking for across our collection of articles</p>

      <div class="search-box">
        <input type="text" placeholder="Search articles, topics, authors...">
      </div>
    </div>
  </section>

  <section class="results-section">
    <h2>SEARCH RESULTS</h2>
    <p>Articles will appear here...</p>
  </section>

  <footer>
    <p>&copy; 2025 BlogNest | All rights reserved.</p>
  </footer>

</body>

</html>
